name: Publish web orrery to GitHub Pages

# Publishes the static frontend in web/ to the gh-pages branch, which GitHub
# Pages serves at https://atlas-lauren.github.io/orrery/

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stamp the script URLs with the commit so browsers and the Pages CDN never
      # pair a fresh app.js with a cached visuals.js after a deploy.
      - name: Version the script URLs
        run: sed -i "s/__BUILD__/${GITHUB_SHA::10}/g" web/index.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
